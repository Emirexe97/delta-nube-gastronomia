name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and workspace
        run: |
          pnpm --filter @gastronomy/web build
          pnpm build

      - name: Package Intel app and create DMG
        if: matrix.arch == 'x64'
        run: |
          pnpm --filter @gastronomy/desktop-shell exec electron-builder --mac dir --x64 --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
          app=$(find apps/desktop-shell/release/mac -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          app_name=$(basename "$app" .app)
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$app_name" -srcfolder "$staging" -ov -format UDZO "apps/desktop-shell/release/${app_name}-x64.dmg"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package Apple Silicon DMG
        if: matrix.arch == 'arm64'
        run: pnpm --filter @gastronomy/desktop-shell exec electron-builder --mac dmg --arm64 --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify DMG and SQLite architecture
        run: |
          shopt -s nullglob
          dmgs=(apps/desktop-shell/release/*.dmg)
          test ${#dmgs[@]} -gt 0
          for dmg in "${dmgs[@]}"; do hdiutil verify "$dmg"; done
          addon=$(find apps/desktop-shell/release -name better_sqlite3.node -print -quit)
          test -n "$addon"
          file "$addon"
          file "$addon" | grep -q "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: delta-nube-gastronomia-macos-${{ matrix.arch }}
          path: apps/desktop-shell/release/*.dmg
          if-no-files-found: error
          retention-days: 14
