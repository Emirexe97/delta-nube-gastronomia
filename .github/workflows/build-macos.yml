name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and workspace
        run: |
          pnpm --filter @gastronomy/web build
          pnpm build

      - name: Package macOS DMG
        run: pnpm --filter @gastronomy/desktop-shell exec electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: delta-nube-gastronomia-macos-${{ matrix.arch }}
          path: apps/desktop-shell/release/*.dmg
          if-no-files-found: error
          retention-days: 14
